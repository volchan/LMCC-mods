# Install, build and release tasks for the mods of apps/lua, run with https://taskfile.dev (Windows, needs pwsh).
# Optional variables: MOD=<name> acts on one mod only, AC_ROOT=<path> for another AC folder.
#   task install:dev MOD=Flags
#   task install:normal AC_ROOT="E:\Games\assettocorsa"
version: '3'

vars:
  MOD: ''
  AC_ROOT: ''
  ARGS: '{{if .MOD}}-Mod "{{.MOD}}"{{end}} {{if .AC_ROOT}}-AcRoot "{{.AC_ROOT}}"{{end}}'
  # bash for the release scripts: from PATH, else the one Git for Windows installs next to git
  # (git --exec-path is <git>/mingw64/libexec/git-core), which is usually not on PATH.
  BASH:
    sh: |
      if command -v bash > /dev/null 2>&1; then
        echo bash
      else
        p="$(git --exec-path)"
        echo "${p%/mingw64/libexec/git-core}/bin/bash.exe"
      fi

tasks:
  install:dev:
    desc: Install the mods as <mod>_dev copies linked to the repo
    cmds:
      - pwsh -NoProfile -File install.ps1 -Mode dev {{.ARGS}}

  install:normal:
    desc: Install the committed mods as drivers get them
    cmds:
      - pwsh -NoProfile -File install.ps1 -Mode normal {{.ARGS}}

  uninstall:dev:
    desc: Remove the <mod>_dev copies
    cmds:
      - pwsh -NoProfile -File install.ps1 -Mode dev -Uninstall {{.ARGS}}

  uninstall:normal:
    desc: Remove the normal installs made by install:normal
    cmds:
      - pwsh -NoProfile -File install.ps1 -Mode normal -Uninstall {{.ARGS}}

  build:
    desc: Build dist/LMCC-mods-<release>.zip from the committed mods
    cmds:
      - '"{{.BASH}}" scripts/build.sh'

  release:
    desc: Tag the pushed main with its release version and push the tag
    cmds:
      - '"{{.BASH}}" scripts/release.sh'
