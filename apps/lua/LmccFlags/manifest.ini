[ABOUT]
NAME = LMCC Flags
AUTHOR = Volchan
VERSION = 0.2.0
DESCRIPTION = Race flags impossible to miss: big panel, screen-edge strips, sound cues and flag history.
REQUIRED_VERSION = 0.1.76

[CORE]
; NONE: track flags, history and sound even when no window is open
LAZY = NONE

; Panel title is used to move the window from the setup screen: keep it in sync with PANEL_TITLE in LmccFlags.lua.
[WINDOW_...]
ID = panel
NAME = LMCC Flags
SIZE = 520, 130
MIN_SIZE = 260, 65
PADDING = 0, 0
FUNCTION_MAIN = windowPanel
FUNCTION_SETTINGS = windowSetup
FLAGS = MAIN, SETTINGS, NO_TITLE_BAR, NO_BACKGROUND, NO_COLLAPSE, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE

[WINDOW_...]
ID = history
NAME = LMCC Flags History
SIZE = 420, 360
FUNCTION_MAIN = windowHistory

[WINDOW_...]
ID = setup
NAME = LMCC Flags Setup
SIZE = 480, 680
FUNCTION_MAIN = windowSetup

[UI_CALLBACKS]
IN_GAME = drawGlow
