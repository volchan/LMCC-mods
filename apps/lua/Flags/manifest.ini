[ABOUT]
NAME = Flags
AUTHOR = DazWorks
VERSION = 1.0.0
DESCRIPTION = Race flags impossible to miss: big panel, screen-edge strips, sound cues and flag history.
REQUIRED_VERSION = 0.1.76

[CORE]
; NONE: track flags, history and sound even when no window is open
LAZY = NONE

; Panel title is used to move the window from the setup screen: keep it in sync with PANEL_TITLE in Flags.lua.
; FIXED_SIZE hides the native resize grip; panel_input.lua draws one only while hovered (MIN_SIZE kept in sync there).
[WINDOW_...]
ID = panel
NAME = Flags
SIZE = 520, 130
MIN_SIZE = 260, 65
PADDING = 0, 0
FUNCTION_MAIN = windowPanel
FUNCTION_SETTINGS = windowSetup
FLAGS = MAIN, SETTINGS, NO_TITLE_BAR, NO_BACKGROUND, NO_COLLAPSE, NO_SCROLLBAR, NO_SCROLL_WITH_MOUSE, FIXED_SIZE

[WINDOW_...]
ID = history
NAME = Flags History
SIZE = 420, 360
FUNCTION_MAIN = windowHistory

[WINDOW_...]
ID = setup
NAME = Flags Setup
SIZE = 420, 430
FUNCTION_MAIN = windowSetup

[UI_CALLBACKS]
IN_GAME = drawGlow
