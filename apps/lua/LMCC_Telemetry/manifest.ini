[ABOUT]
NAME = LMCC Telemetry
AUTHOR = DazWorks
VERSION = 1.3.1
DESCRIPTION = Sends every car's position, speed, pedals and steering, your own car's fuel, damage, tyres and laps, and the flags and penalties LMCC Flags shares, to the LMCC stats. Never the chat.
REQUIRED_VERSION = 0.1.76

[CORE]
; NONE: loaded with the game, window open or not: it records in the background
LAZY = NONE

[WINDOW_...]
ID = main
NAME = LMCC Telemetry
ICON = icon.png
; Status and Settings tabs in the window itself: no cog, no second window
SIZE = 420, 185
FUNCTION_MAIN = windowMain
