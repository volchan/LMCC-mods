[ABOUT]
NAME = LMCC Telemetry
AUTHOR = DazWorks
VERSION = 1.1.1
DESCRIPTION = Sends every car's position, speed and pedals to the LMCC stats, many times a second.
REQUIRED_VERSION = 0.1.76

[CORE]
; NONE: loaded with the game, window open or not: it records in the background
LAZY = NONE

[WINDOW_...]
ID = main
NAME = LMCC Telemetry
SIZE = 420, 140
FUNCTION_MAIN = windowMain
FUNCTION_SETTINGS = windowSettings
; Without it the window has no cog, and the settings are out of reach
FLAGS = SETTINGS
