[ABOUT]
NAME = LMCC Telemetry
AUTHOR = DazWorks
VERSION = 1.2.2
DESCRIPTION = Sends every car's position, speed, pedals and steering, your own car's fuel, damage, tyres and laps, and the penalties LMCC Flags shares, to the LMCC stats. Never the chat.
REQUIRED_VERSION = 0.1.76

[CORE]
; NONE: loaded with the game, window open or not: it records in the background
LAZY = NONE

[WINDOW_...]
ID = main
NAME = LMCC Telemetry
; Status and Settings tabs in the window itself: no cog, no second window
SIZE = 420, 165
FUNCTION_MAIN = windowMain
