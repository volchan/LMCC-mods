# Publishes a release when a release tag is pushed (scripts/release.sh, or `task release`).
# The tag must be the release version of its commit: v<YYYY.MM.DD>.<short hash>.
# The release notes list every mod with its version and server checksum, then the changelogs.
name: Release

on:
  push:
    tags:
      - 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*'

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags for the changelog

      - name: Tag matches its commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          expected="v$(scripts/version.sh "$TAG^{commit}")"
          if [ "$TAG" != "$expected" ]; then
            echo "Tag $TAG does not match its commit: expected $expected." >&2
            exit 1
          fi

      - name: Build
        id: build
        env:
          # The stats site's token, written into LMCC_Telemetry in the zip only
          TELEMETRY_TOKEN: ${{ secrets.TELEMETRY_TOKEN }}
        run: scripts/build.sh

      - name: Release notes
        run: scripts/notes.sh HEAD | tee notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.build.outputs.zip }}
          VERSION: ${{ steps.build.outputs.version }}
        # A release created on GitHub already exists: fill it instead of failing.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "LMCC mods $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "$ZIP" --title "LMCC mods $VERSION" --notes-file notes.md
          fi
