# Builds and publishes a release when a version tag is created: pushed from git
# (`git tag v1.0.1 && git push origin v1.0.1`) or created with a new release on GitHub.
# The tag sets VERSION in the zipped manifest; the release notes give the server checksum and the changelog.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags for the changelog

      # LuaJIT is what CSP runs.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: luajit-openresty

      - name: Test
        run: |
          for f in tests/*_test.lua; do
            echo "== $f"
            luajit "$f"
          done

      - name: Build
        id: build
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/build.sh "${TAG#v}"

      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
          CHECKSUM: ${{ steps.build.outputs.checksum }}
        run: |
          {
            echo "## Server checksum"
            echo
            echo "Required Apps file: \`apps/lua/Flags/manifest.ini\`"
            echo
            echo "MD5: \`$CHECKSUM\`"
            echo
            echo "## Changes"
            echo
            ./scripts/changelog.sh "$TAG"
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.build.outputs.zip }}
          VERSION: ${{ steps.build.outputs.version }}
        # A release created on GitHub already exists: fill it instead of failing.
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            gh release edit "$TAG" --title "Flags $VERSION" --notes-file notes.md
          else
            gh release create "$TAG" "$ZIP" --title "Flags $VERSION" --notes-file notes.md
          fi
