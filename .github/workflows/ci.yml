# Tests, mod version checks and a build on every push and pull request, without publishing.
# Also called by the release workflow before it publishes.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags to compare mod versions with the previous release

      # LuaJIT is what CSP runs.
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: luajit-openresty

      - name: Test
        run: scripts/test.sh

      - name: Mod versions
        run: scripts/check_versions.sh

      - name: Build
        run: scripts/build.sh
